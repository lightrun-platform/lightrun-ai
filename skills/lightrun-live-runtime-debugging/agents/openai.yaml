interface:
  display_name: "Lightrun Live Runtime Debugging"
  short_description: "Diagnose live failures with runtime evidence"
  icon_small: "./assets/lightrun-small.svg"
  icon_large: "./assets/lightrun.png"
  brand_color: "#0078D4"
  default_prompt: "Use $lightrun-live-runtime-debugging to diagnose a live failure by testing hypotheses with targeted Lightrun runtime evidence."

dependencies:
  tools:
    - type: "mcp"
      value: "lightrun"
      description: "Lightrun MCP server"
      transport: "streamable_http"
      url: "https://app.lightrun.com/mcp"
